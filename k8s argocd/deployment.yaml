apiVersion: apps/v1
kind: Deployment
metadata: 
  name: gor
spec:
  replicas: 2
  selector: 
    matchLabels:
      laptop: hp
  template:
    metadata: 
      labels:
       laptop: hp
    spec: 
      containers: 
       - name: grdep
         image: httpd
         ports:
           - containerPort: 4000

      
